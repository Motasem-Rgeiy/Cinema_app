{% extends 'base.html' %}
{% load static %}
{% load my_filters %}

{% block title %}Payment - Cinema Booking{% endblock %}

{% block content %}
<script src="https://js.stripe.com/v3/"></script>

<div class="container" style="margin-top: 50px; max-width: 600px;">
    <div style="background-color: var(--secondary-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h2 style="text-align: center; margin-bottom: 30px;">Complete Your Order</h2>
        
        <form id="payment-form">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" value="{{credentials.email}}" required>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>First Name</label>
                    <input type="text" id="first_name" class="form-control" value="{{credentials.first_name}}" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Last Name</label>
                    <input type="text" id="last_name" class="form-control" value="{{credentials.last_name}}" required>
                </div>
            </div>

            <hr style="border-color: #444; margin: 25px 0;">

            <div id="payment-choice-container">
                <button type="button" id="card-button-trigger" class="btn btn-secondary" style="width: 100%; padding: 12px;">
                    💳 Pay with Credit Card
                </button>
            </div>

            <div id="card-input-section" style="display: none;">
                <div class="form-group">
                    <label>Card Details</label>
                    <div id="card-element" class="form-control" style="padding: 12px; background: white;">
                        </div>
                    <div id="card-errors" role="alert" style="color: #ff4d4d; margin-top: 10px; font-size: 0.9em;"></div>
                </div>

                <button type="submit" id="submit-button" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                    Pay {{total|currency}} Now
                </button>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'js/stripe.js' %}"></script>
{% endblock %}
